services:
  # Spring Boot Backend Web Service
  - type: web
    name: campusfix-backend
    env: java
    region: oregon
    plan: free
    buildCommand: cd backend && ./mvnw clean package -DskipTests
    startCommand: java -jar backend/target/campusfix-backend-1.0.0.jar
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: APP_JWT_SECRET
        generateValue: true

  # React Frontend Static Site
  - type: static
    name: campusfix-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
